  "000": { emoji:"🦥", name:"나무늘보", nick:"궁극의 이완",
    desc:"침대와 물아일체. 배달 앱 VIP 등급 달성.\n세상에서 제일 편안한 표정을 갖고 있습니다.\n이 정도면 쉬는 게 아니라 예술의 경지예요.",
    tags:["#침대와한몸","#배달VIP","#이완의예술"],
    good:"100", bad:"111" },
};

let current = 0;
const scores = [0, 0, 0];
const counts = [0, 0, 0];

function startTest() {
  document.getElementById("intro").classList.remove("active");
  document.getElementById("quiz").classList.add("active");
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById("qcount").textContent = (current + 1) + " / " + QUESTIONS.length;
  document.getElementById("fill").style.width = (current / QUESTIONS.length * 100) + "%";
  document.getElementById("qemoji").textContent = q.e;
  document.getElementById("qtext").textContent = q.t;
  const box = document.getElementById("opts");
  box.innerHTML = "";
  const shuffled = [...q.o].sort(() => Math.random() - 0.5);
  shuffled.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = () => answer(q.axis, o.v);
    box.appendChild(b);
  });
}

function answer(axis, v) {
  scores[axis] += v;
  counts[axis]++;
  current++;
  if (current < QUESTIONS.length) renderQuestion();
  else showResult();
}

function showResult() {
  const key = scores.map((s, i) => (s >= counts[i] / 2 ? "1" : "0")).join("");
  const r = RESULTS[key];
  document.getElementById("quiz").classList.remove("active");
  document.getElementById("result").classList.add("active");
  document.getElementById("r-emoji").textContent = r.emoji;
  document.getElementById("r-name").textContent = r.name;
  document.getElementById("r-nick").textContent = r.nick;
  document.getElementById("r-desc").textContent = r.desc;
  const tags = document.getElementById("r-tags");
  tags.innerHTML = "";
  r.tags.forEach(t => { const s = document.createElement("span"); s.textContent = t; tags.appendChild(s); });
  document.getElementById("good-e").textContent = RESULTS[r.good].emoji;
  document.getElementById("good-n").textContent = RESULTS[r.good].name;
  document.getElementById("bad-e").textContent = RESULTS[r.bad].emoji;
  document.getElementById("bad-n").textContent = RESULTS[r.bad].name;
  window.scrollTo(0, 0);
}

async function shareResult() {
  const name = document.getElementById("r-name").textContent;
  const text = "나의 백수 동물상은 [" + name + "] 💤 너는 어떤 백수일까?";
  const url = location.href.split("#")[0];
  if (navigator.share) {
    try { await navigator.share({ title: "백수 동물상 테스트", text, url }); return; } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(text + " " + url);
    showToast();
  } catch (e) {
    prompt("아래 링크를 복사해서 공유하세요!", url);
  }
}

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
<script>
// 공유 시트 (PC/모바일 공통) — 아래 선언이 위의 shareResult를 덮어씀
function shareResult() { document.getElementById("sheet").classList.add("show"); }
function closeSheet() { document.getElementById("sheet").classList.remove("show"); }
function _shareData() {
  const name = document.getElementById("r-name").textContent;
  const url = location.href.split("#")[0];
  const text = name ? "나의 백수 동물상은 [" + name + "] 💤 너는 어떤 백수일까?" : document.title;
  return { text: text, url: url };
}
function shareTo(app) {
  const d = _shareData();
  const u = encodeURIComponent(d.url), t = encodeURIComponent(d.text);
  const links = {
    twitter: "https://twitter.com/intent/tweet?text=" + t + "&url=" + u,
    facebook: "https://www.facebook.com/sharer/sharer.php?u=" + u,
    line: "https://social-plugins.line.me/lineit/share?url=" + u + "&text=" + t,
    telegram: "https://t.me/share/url?url=" + u + "&text=" + t,
    whatsapp: "https://wa.me/?text=" + t + "%20" + u
  };
  window.open(links[app], "_blank", "noopener,width=620,height=560");
}
async function copyLink() {
  const d = _shareData();
  try { await navigator.clipboard.writeText(d.text + " " + d.url); showToast(); }
  catch (e) { prompt("아래 링크를 복사하세요!", d.url); }
  closeSheet();
}
async function systemShare() {
  const d = _shareData();
  if (navigator.share) { try { await navigator.share({ title: document.title, text: d.text, url: d.url }); } catch (e) {} closeSheet(); }
  else { copyLink(); }
}
</script>

      await _db.collection("nicknames").doc(nick).set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() });

      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
